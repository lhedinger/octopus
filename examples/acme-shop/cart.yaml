octopus: 1
repo: cart
name: Cart
kind: microservice
description: Baskets and price totals
context: purchasing
storage:
  - kind: cache
    name: cart-cache
dependencies:
  - repo: catalog
    label: price lookup
modules:
  - name: Basket
    description: Add/remove items, session binding
  - name: Totals
    description: Prices, discounts, tax
    dependencies: [Basket]
build:
  status: passing
  items: [lint, unit tests, docker image]
test:
  coverage: 70
  items: [unit, contract]
deploy: [staging, production]

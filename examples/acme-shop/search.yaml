octopus: 1
repo: search
name: Search
kind: microservice
description: Product search & ranking
context: discovery
team: discovery
storage:
  - kind: datastore
    name: search-index
modules:
  - name: Indexing
    description: Consumes product.updated events
  - name: Query API
    description: Search endpoint
    dependencies:
      - { module: Ranking, label: scores with }
  - name: Ranking
    description: Relevance and boosts
build:
  status: passing
  items: [lint, unit tests, docker image]
test:
  coverage: 58
  items: [unit, relevance suite]
deploy: [staging, production]
health:
  status: healthy
  uptime: 99.7
environments:
  staging: { version: 1.1.0 }
  production: { version: 1.0.4 }
lifecycle: active
tier: T2
version: 1.0.4
tech: [Python 3.12, FastAPI]

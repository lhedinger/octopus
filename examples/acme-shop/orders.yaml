octopus: 1
repo: orders
name: Orders
kind: microservice
description: Checkout and order lifecycle
context: purchasing
team: commerce
storage:
  - kind: database
    name: orders-db
    engine: postgres 15
    classification: PII
    backup: daily · last 2026-07-13
dependencies:
  - repo: cart
    label: checkout snapshot
    contract: [GET /carts/:id]
    traffic: 40
  - repo: inventory
    label: reserve stock
    contract: [POST /reservations]
    traffic: 30
    auth: api-key
    latency: { p50: 60, p99: 900 }
    errorRate: 2.4
  - repo: payments
    kind: async
    label: order.placed
    contract: [event order.placed v1]
    traffic: 12
  - repo: shipping
    kind: async
    label: order.paid
    contract: [event order.paid v1]
    traffic: 11
modules:
  - name: Checkout
    description: The order placement saga
    dependencies:
      - { module: Order history, label: writes }
    behavior:
      blocks:
        - { name: POST /checkout, kind: trigger }
        - { name: Validate cart, kind: rule }
        - { name: Reserve stock, kind: step }
        - { name: Payment settled?, kind: decision }
        - { name: order.confirmed, kind: event }
        - { name: Confirmed, kind: outcome }
        - { name: Rejected, kind: outcome }
      flow:
        - [POST /checkout, Validate cart]
        - [Validate cart, Reserve stock]
        - [Reserve stock, Payment settled?]
        - { from: Payment settled?, to: order.confirmed, label: yes }
        - { from: Payment settled?, to: Rejected, label: no }
        - [order.confirmed, Confirmed]
  - name: Order history
    description: Query API for past orders
  - name: Lifecycle
    description: State machine and cancellations
    dependencies: [Order history]
build:
  status: failing
  items: [lint, unit tests, docker image]
test:
  coverage: 41
  items: [unit]
health:
  status: degraded
  slo: 99.5
  budget: 8
environments:
  staging: { version: 2.1.0 }
lifecycle: active
tier: T1
version: 2.1.0
tech: [Kotlin, JVM 21, Spring Boot]
links:
  repo: https://github.com/acme/orders
security:
  vulnerabilities: { critical: 0, high: 2, medium: 4 }
  classification: PII
oncall: jonas (commerce rota)
incidents: { active: 1, last: 2026-07-12 }

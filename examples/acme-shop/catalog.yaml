octopus: 1
repo: catalog
name: Catalog
kind: microservice
description: Products, categories, pricing
context: discovery
team: discovery
storage:
  - kind: database
    name: catalog-db
    engine: mysql 8
    classification: internal
dependencies:
  - repo: search
    kind: async
    label: product.updated
modules:
  - name: Products
    description: Catalogue CRUD and categories
  - name: Pricing
    description: Price rules and promotions
    dependencies: [Products]
  - name: Media
    description: Product images and assets
    dependencies: [Products]
build:
  status: passing
  items: [lint, unit tests, docker image]
test:
  coverage: 64
  items: [unit, pricing rules suite]
deploy: [staging, production]
health:
  status: healthy
  uptime: 99.9
environments:
  staging: { version: 2.4.0 }
  production: { version: 2.3.9 }
lifecycle: active
tier: T2
version: 2.3.9
tech: [TypeScript, Node 20, NestJS]
security:
  vulnerabilities: { high: 1, medium: 3 }

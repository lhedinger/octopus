octopus: 1
repo: identity
name: Identity
kind: microservice
description: Sign-in, tokens, profiles
context: identity
team: platform
storage:
  - kind: database
    name: identity-db
  - kind: cache
    name: session-cache
dependencies:
  - repo: notifications
    kind: async
    label: user.registered
modules:
  - name: Authentication
    description: Sign-in flows and MFA
    dependencies:
      - { module: Tokens, label: issues }
  - name: Tokens
    description: JWT issuing and rotation
  - name: Profiles
    description: Account data and preferences
build:
  status: passing
  items: [lint, unit tests, docker image]
test:
  coverage: 91
  items: [unit, contract, security suite]
deploy: [staging, production]
health:
  status: healthy
  uptime: 99.99
environments:
  staging: { version: 5.0.1 }
  production: { version: 5.0.1 }

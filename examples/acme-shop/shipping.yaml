octopus: 1
repo: shipping
name: Shipping
kind: microservice
description: Fulfilment and carrier hand-off
context: fulfillment
team: fulfillment
storage:
  - kind: database
    name: shipping-db
dependencies:
  - repo: carrier-api
    label: book pickup
  - repo: notifications
    kind: async
    label: shipment.dispatched
modules:
  - name: Booking
    description: Carrier selection and pickup
  - name: Tracking
    description: Shipment status ingestion
    dependencies:
      - { module: Booking, label: updates }
build:
  status: passing
  items: [lint, unit tests, docker image]
test:
  coverage: 66
  items: [unit, contract]
deploy: [staging, production]

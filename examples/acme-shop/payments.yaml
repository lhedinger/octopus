octopus: 1
repo: payments
name: Payments
kind: microservice
description: Charges cards and settles invoices
context: billing
team: payments
storage:
  - kind: database
    name: payments-db
    engine: postgres 15
    classification: PCI
    backup: daily · last 2026-07-13
  - kind: cache
    name: idempotency-cache
dependencies:
  # Not scanned — appears on the map as an external-system stub.
  - repo: stripe
    label: charge API
    contract: [POST /v1/charges, POST /v1/refunds]
    traffic: 14
    auth: api-key
    latency: { p50: 180, p99: 850 }
    errorRate: 0.3
    golden: true
  - repo: orders
    kind: async
    label: payment.settled
    contract: [event payment.settled v1]
    traffic: 12
  - repo: notifications
    kind: async
    label: payment.settled
    contract: [event payment.settled v1]
    traffic: 12
modules:
  - name: Charging
    description: Card charges and idempotency
    dependencies:
      - { module: Invoicing, label: settles }
    behavior:
      blocks:
        - { name: POST /charge, kind: trigger }
        - { name: Validate request, kind: rule }
        - { name: Charge provider, kind: step }
        - { name: Charged?, kind: decision }
        - { name: payment.settled, kind: event }
        - { name: Receipt stored, kind: outcome }
        - { name: Charge failed, kind: outcome }
      flow:
        - [POST /charge, Validate request]
        - [Validate request, Charge provider]
        - [Charge provider, Charged?]
        - { from: Charged?, to: payment.settled, label: yes }
        - { from: Charged?, to: Charge failed, label: no }
        - [payment.settled, Receipt stored]
  - name: Refunds
    description: Reversals and disputes
    dependencies: [Charging]
  - name: Invoicing
    description: Receipts and settlement records
  - name: Provider webhooks
    description: Async status updates from Stripe
    dependencies:
      - { module: Charging, label: status updates }
build:
  status: passing
  items: [lint, unit tests, contract tests, docker image]
test:
  coverage: 87
  items: [unit, contract, e2e smoke]
health:
  status: healthy
  uptime: 99.95
  slo: 99.9
  budget: 62
environments:
  staging: { version: 1.8.0 }
  production: { version: 1.7.2 }
lifecycle: active
tier: T0
version: 1.7.2
commit: 9f2c1ab34
tech: [TypeScript, Node 20, Fastify]
links:
  repo: https://github.com/acme/payments
  runbook: https://wiki.acme.dev/payments/runbook
  dashboard: https://grafana.acme.dev/d/payments
security:
  vulnerabilities: { critical: 0, high: 0, medium: 1 }
  classification: PCI
oncall: rana (payments rota)
incidents: { active: 0, last: 2026-05-02 }
